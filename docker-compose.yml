services:
  trino:
    image: ${TRINO_IMAGE:-trinodb/trino:latest}
    container_name: trino
    ports:
      - "${TRINO_PORT:-8080}:8080"
    networks:
      iceberg_net:
    depends_on:
      - rest
      - minio
    volumes:
      - ./trino/iceberg.properties:/etc/trino/catalog/iceberg.properties
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-password}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - WAREHOUSE_BUCKET=${WAREHOUSE_BUCKET:-warehouse}

  rest:
    image: ${REST_IMAGE:-apache/iceberg-rest-fixture}
    container_name: iceberg-rest
    networks:
      iceberg_net:
    ports:
      - "${REST_PORT:-8181}:8181"
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-password}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - CATALOG_WAREHOUSE=s3://${WAREHOUSE_BUCKET:-warehouse}/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000

  minio:
    build:
      context: ./minio
      args:
        MINIO_TAG: ${MINIO_TAG:-RELEASE.2025-04-22T22-12-26Z}
    image: local/minio:${MINIO_TAG:-RELEASE.2025-04-22T22-12-26Z}
    container_name: minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password}
      - MINIO_DOMAIN=minio
    networks:
      iceberg_net:
        aliases:
          - ${WAREHOUSE_BUCKET:-warehouse}.minio
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
      - "${MINIO_API_PORT:-9000}:9000"
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data

  mc:
    build:
      context: ./minio
      dockerfile: Dockerfile.mc
      args:
        MC_TAG: ${MC_TAG:-RELEASE.2025-04-16T18-13-26Z}
    image: local/mc:${MC_TAG:-RELEASE.2025-04-16T18-13-26Z}
    container_name: mc
    depends_on:
      - minio
    networks:
      iceberg_net:
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password}
      - WAREHOUSE_BUCKET=${WAREHOUSE_BUCKET:-warehouse}
    entrypoint: |
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}); do echo '...waiting...' && sleep 1; done;

      /usr/bin/mc mb --ignore-existing minio/$${WAREHOUSE_BUCKET};
      /usr/bin/mc anonymous set public minio/$${WAREHOUSE_BUCKET};
      tail -f /dev/null
      "

networks:
  iceberg_net:

volumes:
  minio_data:
